<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil | Farhan Nur Hakim</title>
    
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Font Inter dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 32px 28px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid #e2e8f0;
        }

        /* Header Profil */
        .card-header {
            text-align: center;
        }

        /* Slot Khusus Foto Saya */
        .photo-slot {
            width: 110px;
            height: 110px;
            margin: 0 auto 16px auto;
            border-radius: 50%;
            border: 2px dashed #94a3b8;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #64748b;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .photo-slot:hover {
            border-color: #2563eb;
            background-color: #eff6ff;
            color: #2563eb;
        }

        .photo-slot i {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .photo-slot span {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Tampilan jika img dimasukkan */
        .photo-slot img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }

        .name {
            font-size: 20px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-top: 4px;
            font-weight: 500;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 24px 0;
        }

        /* Detail Informasi */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .info-icon {
            width: 36px;
            height: 36px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            font-size: 14px;
            flex-shrink: 0;
        }

        .info-text {
            display: flex;
            flex-direction: column;
        }

        .info-text .label {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-text .value {
            font-size: 14px;
            color: #1e293b;
            font-weight: 600;
        }

        /* Tombol Aksi */
        .action-section {
            margin-top: 28px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: #1e293b;
        }

        /* Sosmed Footer */
        .social-footer {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
        }

        .social-footer a {
            color: #94a3b8;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .social-footer a:hover {
            color: #0f172a;
        }
    </style>
</head>
<body>

    <main class="profile-card">
        <!-- Header Profil -->
        <div class="card-header">
            
            <!-- SLOT FOTO SAYA -->
            <div class="photo-slot">
                <i class="fas fa-camera"></i>
                <span>Foto Saya</span>
                
                <!-- 
                  PETUNJUK: 
                  Jika foto sudah ada, hapus tanda komentar (<!-- dan -->) pada tag img di bawah ini
                  lalu ganti "foto-farhan.jpg" dengan nama/lokasi file foto kamu.
                -->
                <!-- <img src="foto-farhan.jpg" alt="Farhan Nur Hakim"> -->
            </div>

            <h1 class="name">Farhan Nur Hakim</h1>
            <p class="subtitle">Siswa SMA • Calon Pengusaha</p>
        </div>

        <hr class="divider">

        <!-- Informasi Detail -->
        <div class="info-section">
            <div class="info-row">
                <div class="info-icon"><i class="fas fa-graduation-cap"></i></div>
                <div class="info-text">
                    <span class="label">Kelas</span>
                    <span class="value">X-G</span>
                </div>
            </div>

            <div class="info-row">
                <div class="info-icon"><i class="fas fa-calendar-alt"></i></div>
                <div class="info-text">
                    <span class="label">Tanggal Lahir / Umur</span>
                    <span class="value">21 Desember 2010 (15 Tahun)</span>
                </div>
            </div>

            <div class="info-row">
                <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="info-text">
                    <span class="label">Lokasi</span>
                    <span class="value">Bandung, Jawa Barat</span>
                </div>
            </div>

            <div class="info-row">
                <div class="info-icon"><i class="fas fa-bullseye"></i></div>
                <div class="info-text">
                    <span class="label">Cita-cita</span>
                    <span class="value">Pengusaha</span>
                </div>
            </div>

            <div class="info-row">
                <div class="info-icon"><i class="fas fa-gamepad"></i></div>
                <div class="info-text">
                    <span class="label">Hobi</span>
                    <span class="value">Bermain Game</span>
                </div>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="action-section">
            <button class="btn-primary" id="contactBtn">Hubungi Saya</button>
        </div>

        <!-- Sosial Media -->
        <div class="social-footer">
            <a href="#" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
            <a href="#" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        </div>
    </main>

    <script>
        const contactBtn = document.getElementById('contactBtn');

        contactBtn.addEventListener('click', () => {
            alert("Terima kasih telah mengunjungi profil Farhan Nur Hakim.");
        });
    </script>
</body>
</html>
